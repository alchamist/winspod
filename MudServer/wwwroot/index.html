<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>Homelands Uni</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; }
  #terminal { width: 100%; height: 100vh; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
  // Bare proof-of-concept for the WebSocket<->telnet bridge (Api/TelnetWebSocketBridge.cs) -
  // a real terminal, real game, no server changes needed beyond the bridge itself. The
  // friendlier newcomer wrapper (help sidebar, clickable commands) is a separate pass on
  // top of this once the bridge itself is confirmed working end-to-end.
  const term = new Terminal({ cursorBlink: true, convertEol: true, fontFamily: "monospace" });
  const fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById("terminal"));
  fitAddon.fit();
  window.addEventListener("resize", () => fitAddon.fit());

  const ECHO_OFF = "ECHO-OFF";
  const ECHO_ON = "ECHO-ON";

  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(proto + "//" + location.host + "/ws");

  let echoEnabled = true;
  let lineBuffer = "";

  ws.onmessage = (event) => {
    let text = event.data;
    if (text === ECHO_OFF) { echoEnabled = false; return; }
    if (text === ECHO_ON) { echoEnabled = true; return; }
    term.write(text);
  };

  ws.onclose = () => term.write("\r\n\r\n[Connection closed]\r\n");
  ws.onerror = () => term.write("\r\n\r\n[Connection error]\r\n");

  term.onData((data) => {
    for (const ch of data) {
      const code = ch.charCodeAt(0);
      if (ch === "\r" || ch === "\n") {
        ws.send(lineBuffer + "\r\n");
        if (echoEnabled) term.write("\r\n");
        lineBuffer = "";
      } else if (code === 127 || code === 8) { // backspace/delete
        if (lineBuffer.length > 0) {
          lineBuffer = lineBuffer.slice(0, -1);
          if (echoEnabled) term.write("\b \b");
        }
      } else if (code < 32) {
        // ignore other control sequences (arrow keys etc.) for this bare proof-of-concept
      } else {
        lineBuffer += ch;
        if (echoEnabled) term.write(ch);
      }
    }
  });
</script>
</body>
</html>
